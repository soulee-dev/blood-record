<svg xmlns="http://www.w3.org/2000/svg" width="380" height="615" viewBox="0 0 380 615">
  <defs>
    <linearGradient id="top-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#C41E3A"/>
      <stop offset="100%" style="stop-color:#A01830"/>
    </linearGradient>
    <linearGradient id="body-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F8F6F3"/>
      <stop offset="100%" style="stop-color:#EEEAE4"/>
    </linearGradient>
    <linearGradient id="bar-fill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#C41E3A"/>
      <stop offset="100%" style="stop-color:#E85D75"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-3%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#00000022"/>
    </filter>
  </defs>

  <!-- 카드 외곽 -->
  <rect x="10" y="10" width="360" height="595" rx="12" fill="url(#body-bg)" filter="url(#shadow)"/>

  <!-- 상단 컬러 영역 -->
  <rect x="10" y="10" width="360" height="160" rx="12" fill="url(#top-bg)"/>
  <rect x="10" y="100" width="360" height="70" fill="url(#top-bg)"/>

  <!-- 십자가 심볼 -->
  <rect x="160" y="38" width="60" height="20" rx="4" fill="#FFFFFF" opacity="0.9"/>
  <rect x="180" y="18" width="20" height="60" rx="4" fill="#FFFFFF" opacity="0.9"/>

  <!-- 헌혈 기록 타이틀 -->
  <text x="190" y="115" text-anchor="middle"
        font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="400"
        fill="rgba(255,255,255,0.7)" letter-spacing="6">헌혈 기록</text>
  <text x="190" y="155" text-anchor="middle"
        font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="15"
        fill="rgba(255,255,255,0.6)" letter-spacing="2">명예대장</text>

  <!-- 총 헌혈 횟수 -->
  <text x="190" y="225" text-anchor="middle"
        font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="14" font-weight="400"
        fill="#888">총 헌혈 횟수</text>
  <text x="190" y="280" text-anchor="middle"
        font-family="'Segoe UI', 'Malgun Gothic', sans-serif" font-size="64" font-weight="800"
        fill="#C41E3A">210</text>
  <text x="246" y="280" text-anchor="start"
        font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="18" font-weight="400"
        fill="#C41E3A">회</text>

  <!-- 구분선 -->
  <line x1="50" y1="305" x2="340" y2="305" stroke="#D6D0C8" stroke-width="1"/>

  <!-- 종류별 내역 -->
  <text x="50" y="330" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif"
        font-size="13" fill="#555">전혈</text>
  <text x="340" y="330" text-anchor="end"
        font-family="'Segoe UI', 'Malgun Gothic', sans-serif" font-size="13" font-weight="700"
        fill="#333">100회</text>
  <rect x="50" y="338" width="280" height="10" rx="5" fill="#E8E2DA"/>
  <rect x="50" y="338" width="280" height="10" rx="5" fill="url(#bar-fill)"/>
  <text x="50" y="374" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif"
        font-size="13" fill="#555">혈장</text>
  <text x="340" y="374" text-anchor="end"
        font-family="'Segoe UI', 'Malgun Gothic', sans-serif" font-size="13" font-weight="700"
        fill="#333">40회</text>
  <rect x="50" y="382" width="280" height="10" rx="5" fill="#E8E2DA"/>
  <rect x="50" y="382" width="112" height="10" rx="5" fill="url(#bar-fill)"/>
  <text x="50" y="418" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif"
        font-size="13" fill="#555">혈소판</text>
  <text x="340" y="418" text-anchor="end"
        font-family="'Segoe UI', 'Malgun Gothic', sans-serif" font-size="13" font-weight="700"
        fill="#333">50회</text>
  <rect x="50" y="426" width="280" height="10" rx="5" fill="#E8E2DA"/>
  <rect x="50" y="426" width="140" height="10" rx="5" fill="url(#bar-fill)"/>
  <text x="50" y="462" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif"
        font-size="13" fill="#555">혈소판혈장</text>
  <text x="340" y="462" text-anchor="end"
        font-family="'Segoe UI', 'Malgun Gothic', sans-serif" font-size="13" font-weight="700"
        fill="#333">15회</text>
  <rect x="50" y="470" width="280" height="10" rx="5" fill="#E8E2DA"/>
  <rect x="50" y="470" width="42" height="10" rx="5" fill="url(#bar-fill)"/>
  <text x="50" y="506" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif"
        font-size="13" fill="#555">기타</text>
  <text x="340" y="506" text-anchor="end"
        font-family="'Segoe UI', 'Malgun Gothic', sans-serif" font-size="13" font-weight="700"
        fill="#333">5회</text>
  <rect x="50" y="514" width="280" height="10" rx="5" fill="#E8E2DA"/>
  <rect x="50" y="514" width="14" height="10" rx="5" fill="url(#bar-fill)"/>

  <!-- 날짜 -->
  <line x1="50" y1="565" x2="340" y2="565" stroke="#D6D0C8" stroke-width="1"/>
  <text x="190" y="590" text-anchor="middle"
        font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11"
        fill="#AAA">2026.01.31 기준</text>
</svg>